version: '3.8'

services:
  # Nuxt приложение
  nuxt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: voiceover-nuxt
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - voiceover-network

  # Socket.io сервер
  socket:
    build:
      context: .
      dockerfile: Dockerfile.socket
    container_name: voiceover-socket
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SOCKET_PORT=3001
    networks:
      - voiceover-network

  # Caddy веб-сервер с встроенной конфигурацией
  caddy:
    image: caddy:2-alpine
    container_name: voiceover-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: |
      caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    networks:
      - voiceover-network
    depends_on:
      - nuxt
      - socket

networks:
  voiceover-network:
    driver: bridge
